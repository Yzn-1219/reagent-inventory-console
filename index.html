<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>试剂出入库管理台</title>
<script>
/* 分享码透传：本站点由平台网关按 sharecode 放行，链接不带 sharecode 一律 403。
   微信 / 新设备 / 清了 Cookie 时，连 css、js 也会被拦，
   所以把当前页面的 sharecode 拼到每个资源 URL 上，不再依赖 Cookie。 */
(function () {
  function readSharecode() {
    try {
      var sp = new URLSearchParams(location.search);
      var keys = ['sharecode', 'shareCode', 'share_code'];
      for (var i = 0; i < keys.length; i++) {
        var v = sp.get(keys[i]);
        if (v) return String(v).trim();
      }
      var m = String(location.hash || '').match(/sharecode=([^&]+)/i);
      return m ? decodeURIComponent(m[1]) : '';
    } catch (e) { return ''; }
  }
  var SC = readSharecode();
  window.__SHARECODE__ = SC;
  window.assetUrl = function (u) {
    if (!SC) return u;
    return u + (u.indexOf('?') >= 0 ? '&' : '?') + 'sharecode=' + encodeURIComponent(SC);
  };

  window.APP_BUILD = '20261123-1630';

  var l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = window.assetUrl('assets/app.css?v=' + window.APP_BUILD);
  document.head.appendChild(l);
})();
</script>
</head>
<body>
<div id="boot">正在加载…</div>
<script>
/* 顺序加载脚本，保证 store.js 先于 app.js */
(function () {
  var B = window.APP_BUILD;
  var files = [
    'assets/vendor/workbuddy-cloud.js',
    'assets/vendor/qrcode.js?v=' + B,
    'assets/xlsx.js?v=' + B,
    'assets/store.js?v=' + B,
    'assets/app.js?v=' + B
  ];
  var i = 0;
  (function next() {
    if (i >= files.length) return;
    var s = document.createElement('script');
    s.src = window.assetUrl(files[i++]);
    s.async = false;
    s.onload = next;
    s.onerror = next;
    document.body.appendChild(s);
  })();
})();

/* 版本守卫：服务端构建号更新时，带新参数重载一次；同一版本只跳一次，避免死循环 */
(function () {
  try {
    fetch(window.assetUrl('version.json?t=' + Date.now()), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.build || j.build === window.APP_BUILD) return;
        var tried = '';
        try { tried = sessionStorage.getItem('rio_build_try') || ''; } catch (e) { }
        if (tried === j.build) return;
        try { sessionStorage.setItem('rio_build_try', j.build); } catch (e) { }
        var u = new URL(location.href);
        u.searchParams.set('v', j.build);
        location.replace(u.toString());
      })
      .catch(function () { });
  } catch (e) { }
})();
</script>
</body>
</html>
